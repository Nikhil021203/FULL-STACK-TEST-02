databases:
  - name: fullstack-test-db
    plan: free

services:
  - type: web
    name: fullstack-test-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fullstack-test-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: fullstack-test-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fullstack-test-db
          property: password
      - key: FRONTEND_URL
        value: https://fullstack-test-frontend.onrender.com

  - type: web
    name: fullstack-test-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://fullstack-test-backend.onrender.com
